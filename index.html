<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventaire Joseph</title>
<style>
  :root{
    --cream:#F5F7FA;
    --wheat:#E8EDF5;
    --crust:#3A5A8A;
    --crust-dark:#1E3A5F;
    --ink:#1A2B3C;
    --blue:#2E6DA4;
    --blue-dark:#1A4A7A;
    --line:#C5D4E8;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:130px;}

  header{
    padding:20px 16px 14px;
    background:var(--crust);
    color:var(--white);
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header h1{margin:0;font-size:20px;font-weight:700;}
  header .date{margin-top:2px;font-size:13px;opacity:0.8;}

  nav{
    display:flex;gap:6px;
    padding:12px 12px 0;
    background:var(--crust);
  }
  nav button{
    flex:1;padding:11px 4px;
    border:none;border-radius:10px 10px 0 0;
    font-size:14px;font-weight:600;
    background:rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.8);
  }
  nav button.active{background:var(--cream);color:var(--crust-dark);}

  main{padding:14px 12px 0;}
  .category{display:none;}
  .category.active{display:block;}

  .row{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .row .name{font-size:16px;font-weight:600;flex:1;}
  .row input[type=number]{
    width:76px;font-size:22px;font-weight:700;text-align:center;
    padding:9px 4px;border:2px solid var(--line);border-radius:10px;
    background:var(--cream);color:var(--ink);
  }
  .row input[type=number]:focus{outline:none;border-color:var(--blue);}

  .cake{
    background:var(--white);border:1px solid var(--line);
    border-radius:12px;margin-bottom:8px;overflow:hidden;
  }
  .cake summary{
    list-style:none;padding:13px 14px;
    font-size:16px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .cake summary::-webkit-details-marker{display:none;}
  .cake summary .chev{color:var(--crust);font-size:13px;transition:transform .15s;}
  .cake[open] summary .chev{transform:rotate(90deg);}
  .formats{
    padding:4px 14px 12px;
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .fmt{background:var(--cream);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;}
  .fmt label{font-size:11px;color:var(--crust-dark);font-weight:600;}
  .fmt input{
    width:100%;font-size:18px;font-weight:700;text-align:center;
    padding:7px 2px;border:2px solid var(--line);border-radius:7px;background:var(--white);
  }
  .fmt input:focus{outline:none;border-color:var(--blue);}

  .add-btn{
    display:block;width:100%;padding:13px;margin:4px 0 18px;
    border:2px dashed var(--line);border-radius:12px;
    background:transparent;color:var(--crust-dark);font-size:14px;font-weight:600;
  }

  footer{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--cream) 60%,rgba(245,247,250,0));
  }
  .email-row{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .email-row label{font-size:13px;color:var(--crust-dark);font-weight:600;white-space:nowrap;}
  .email-row input{
    flex:1;padding:9px 11px;border:2px solid var(--line);border-radius:9px;
    font-size:13px;background:var(--white);color:var(--ink);
  }
  .send-btn{
    width:100%;padding:15px;border:none;border-radius:12px;
    background:var(--blue);color:#fff;font-size:17px;font-weight:700;
    box-shadow:0 4px 14px rgba(46,109,164,0.35);
  }
  .send-btn:active{background:var(--blue-dark);}
  .hint{text-align:center;font-size:12px;color:#7a8fa6;margin:3px 0 6px;}
</style>
</head>
<body>

<header>
  <h1>🥐 Inventaire — Boulangeries Joseph</h1>
  <div class="date" id="today"></div>
</header>

<nav>
  <button class="tab active" data-cat="macarons">Macarons</button>
  <button class="tab" data-cat="patisserie">Pâtisserie</button>
  <button class="tab" data-cat="chocolats">Chocolats</button>
</nav>

<main>
  <section class="category active" id="macarons">
    <div id="list-macarons"></div>
    <button class="add-btn" onclick="addSimple('macarons')">+ Ajouter un produit</button>
  </section>
  <section class="category" id="patisserie">
    <div class="hint">Touchez un gâteau pour saisir les formats</div>
    <div id="list-patisserie"></div>
    <button class="add-btn" onclick="addCake()">+ Ajouter un produit</button>
  </section>
  <section class="category" id="chocolats">
    <div id="list-chocolats"></div>
    <button class="add-btn" onclick="addSimple('chocolats')">+ Ajouter un produit</button>
  </section>
</main>

<footer>
  <div class="email-row">
    <label>Envoyer à :</label>
    <input type="email" id="email-dest" value="commandes.duchesse@gmail.com">
  </div>
  <button class="send-btn" id="send-btn" onclick="sendInventory()">Envoyer l'inventaire par mail</button>
</footer>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpYVzKn-CKes9RWJ0OZdErxE6Si3hbaRtXVUPXW6IUseGDmvBdmogV5dCBl5MYRnW2Ug/exec";

const DATA = {
  macarons: ["Chocolat","Café","Caramel","Vanille","Pistache","Plantagenet","Framboise","Fraise","Citron","Fruit des bois","Absinthe","Champigny","Réglisse","Pomme Tatin"],
  chocolats: [],
  patisserie: ["Concerto","Caramélia","3 Chocolat","Echiquier","Sultan","Carmin","Tarte exotique","Tarte citron","Armoricain","Pavé pistache","Eclair café","Eclair chocolat"]
};
const FORMATS = ["indiv","4p","6p","8p","10p","12p"];
const FORMAT_LABELS = {indiv:"Individuel","4p":"4 parts","6p":"6 parts","8p":"8 parts","10p":"10 parts","12p":"12 parts"};

function renderSimple(cat){
  const c = document.getElementById("list-"+cat);
  c.innerHTML = "";
  DATA[cat].forEach(name=>{
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML = `<div class="name">${name}</div><input type="number" inputmode="numeric" min="0" placeholder="0" data-cat="${cat}" data-name="${name}">`;
    c.appendChild(d);
  });
}

function renderPatisserie(){
  const c = document.getElementById("list-patisserie");
  c.innerHTML = "";
  DATA.patisserie.forEach(name=>{
    const det = document.createElement("details");
    det.className = "cake";
    det.innerHTML = `<summary>${name} <span class="chev">▶</span></summary><div class="formats">${FORMATS.map(f=>`<div class="fmt"><label>${FORMAT_LABELS[f]}</label><input type="number" inputmode="numeric" min="0" placeholder="0" data-cat="patisserie" data-name="${name}" data-fmt="${f}"></div>`).join("")}</div>`;
    c.appendChild(det);
  });
}

function renderAll(){ renderSimple("macarons"); renderSimple("chocolats"); renderPatisserie(); }
renderAll();

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".category").forEach(c=>c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.cat).classList.add("active");
  });
});

function addSimple(cat){ const n=prompt("Nom du produit :"); if(n&&n.trim()){DATA[cat].push(n.trim());renderSimple(cat);} }
function addCake(){ const n=prompt("Nom du gâteau :"); if(n&&n.trim()){DATA.patisserie.push(n.trim());renderPatisserie();} }

document.getElementById("today").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

async function sendInventory(){
  const btn = document.getElementById("send-btn");
  btn.textContent = "Envoi en cours...";
  btn.disabled = true;

  const emailDest = document.getElementById("email-dest").value || "commandes.duchesse@gmail.com";
  const payload = { macarons:[], patisserie:[], chocolats:[], emailTo: emailDest };
  let hasData = false;

  ["macarons","chocolats"].forEach(cat=>{
    document.querySelectorAll(`input[data-cat="${cat}"]`).forEach(inp=>{
      const v = parseInt(inp.value,10);
      if(v>0){ hasData=true; payload[cat].push({nom:inp.dataset.name, quantite:v}); }
    });
  });

  const cakeMap = {};
  document.querySelectorAll(`input[data-cat="patisserie"]`).forEach(inp=>{
    const v = parseInt(inp.value,10);
    if(v>0){ hasData=true; if(!cakeMap[inp.dataset.name]) cakeMap[inp.dataset.name]={nom:inp.dataset.name}; cakeMap[inp.dataset.name][inp.dataset.fmt]=v; }
  });
  payload.patisserie = Object.values(cakeMap);

  if(!hasData){ alert("Aucune quantité saisie."); btn.textContent="Envoyer l'inventaire par mail"; btn.disabled=false; return; }

  try {
    await fetch(SCRIPT_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    await new Promise(r=>setTimeout(r,2000));
    btn.textContent = "✅ Inventaire envoyé !";
    btn.style.background = "#2A7A3B";
    setTimeout(()=>{
      document.querySelectorAll("input[type=number]").forEach(i=>i.value="");
      btn.textContent = "Envoyer l'inventaire par mail";
      btn.style.background = "";
      btn.disabled = false;
    }, 3000);
  } catch(e) {
    alert("Erreur de connexion. Vérifie le wifi.");
    btn.textContent = "Envoyer l'inventaire par mail";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
