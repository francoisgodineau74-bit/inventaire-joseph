<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventaire Joseph</title>
<style>
  :root{
    --cream:#F7F1E8;
    --wheat:#E9DCC3;
    --crust:#8A5A2B;
    --crust-dark:#5C3A1B;
    --ink:#2B2320;
    --raspberry:#B23A48;
    --raspberry-dark:#8E2C38;
    --line:#DCCBA8;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:120px;}

  header{
    padding:22px 20px 16px;
    background:var(--crust);
    color:var(--cream);
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  header h1{
    margin:0;
    font-size:22px;
    letter-spacing:0.3px;
    font-weight:700;
  }
  header .date{
    margin-top:2px;
    font-size:13px;
    color:var(--wheat);
    opacity:0.9;
  }

  nav{
    display:flex;
    gap:8px;
    padding:14px 16px 0;
    background:var(--crust);
  }
  nav button{
    flex:1;
    padding:12px 6px;
    border:none;
    border-radius:12px 12px 0 0;
    font-size:15px;
    font-weight:600;
    background:rgba(255,255,255,0.12);
    color:var(--wheat);
    transition:background .15s;
  }
  nav button.active{
    background:var(--cream);
    color:var(--crust-dark);
  }

  main{padding:18px 16px 0;}

  .category{display:none;}
  .category.active{display:block;}

  .row{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .row .name{
    font-size:17px;
    font-weight:600;
    flex:1;
  }
  .row input[type=number]{
    width:78px;
    font-size:22px;
    font-weight:700;
    text-align:center;
    padding:10px 4px;
    border:2px solid var(--line);
    border-radius:10px;
    background:var(--cream);
    color:var(--ink);
  }
  .row input[type=number]:focus{
    outline:none;
    border-color:var(--raspberry);
  }

  /* Pâtisserie : produit dépliable avec 6 formats */
  .cake{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .cake summary{
    list-style:none;
    padding:14px 16px;
    font-size:17px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .cake summary::-webkit-details-marker{display:none;}
  .cake summary .chevron{
    color:var(--crust);
    font-size:14px;
    transition:transform .15s;
  }
  .cake[open] summary .chevron{transform:rotate(90deg);}
  .cake summary .badge{
    font-size:12px;
    font-weight:700;
    color:var(--raspberry);
    margin-left:8px;
  }
  .formats{
    padding:4px 16px 14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .fmt{
    background:var(--cream);
    border-radius:10px;
    padding:8px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .fmt label{font-size:12px;color:var(--crust-dark);font-weight:600;}
  .fmt input{
    width:100%;
    font-size:19px;
    font-weight:700;
    text-align:center;
    padding:8px 2px;
    border:2px solid var(--line);
    border-radius:8px;
    background:var(--white);
  }
  .fmt input:focus{outline:none;border-color:var(--raspberry);}

  .add-row{
    display:block;
    width:100%;
    padding:14px;
    margin:6px 0 20px;
    border:2px dashed var(--line);
    border-radius:14px;
    background:transparent;
    color:var(--crust-dark);
    font-size:15px;
    font-weight:600;
  }

  footer{
    position:fixed;
    left:0;right:0;bottom:0;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--cream) 60%, rgba(247,241,232,0));
  }
  .send-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--raspberry);
    color:#fff;
    font-size:17px;
    font-weight:700;
    box-shadow:0 4px 14px rgba(178,58,72,0.35);
  }
  .send-btn:active{background:var(--raspberry-dark);}

  .hint{
    text-align:center;
    font-size:12px;
    color:#8a7a63;
    margin:4px 0 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🥐 Inventaire — Boulangeries Joseph</h1>
  <div class="date" id="today"></div>
</header>

<nav>
  <button class="tab active" data-cat="macarons">Macarons</button>
  <button class="tab" data-cat="patisserie">Pâtisserie</button>
  <button class="tab" data-cat="chocolats">Chocolats</button>
</nav>

<main>

  <!-- MACARONS -->
  <section class="category active" id="macarons">
    <div class="list" id="list-macarons"></div>
    <button class="add-row" onclick="addSimpleProduct('macarons')">+ Ajouter un produit</button>
  </section>

  <!-- PATISSERIE -->
  <section class="category" id="patisserie">
    <div class="hint">Touchez un gâteau pour saisir les formats concernés</div>
    <div class="list" id="list-patisserie"></div>
    <button class="add-row" onclick="addCakeProduct()">+ Ajouter un produit</button>
  </section>

  <!-- CHOCOLATS -->
  <section class="category" id="chocolats">
    <div class="list" id="list-chocolats"></div>
    <button class="add-row" onclick="addSimpleProduct('chocolats')">+ Ajouter un produit</button>
  </section>

</main>

<footer>
  <button class="send-btn" onclick="sendInventory()">Envoyer l'inventaire par mail</button>
</footer>

<script>
// ---------- Données produits (modifiables ici) ----------
const DATA = {
  macarons: [
    "Chocolat","Café","Caramel","Vanille","Pistache","Plantagenet",
    "Framboise","Fraise","Citron","Fruit des bois","Absinthe",
    "Champigny","Réglisse","Pomme Tatin"
  ],
  chocolats: [
    // à compléter — utilisez "+ Ajouter un produit" ou demandez la mise à jour du fichier
  ],
  patisserie: [
    "Concerto","Caramélia","3 Chocolat","Echiquier","Sultan",
    "Carmin","Tarte exotique","Tarte citron","Armoricain",
    "Pavé pistache","Eclair café","Eclair chocolat"
  ]
};
const FORMATS = ["indiv","4p","6p","8p","10p","12p"];
const FORMAT_LABELS = {indiv:"Individuel","4p":"4 parts","6p":"6 parts","8p":"8 parts","10p":"10 parts","12p":"12 parts"};

const EMAIL_TO = "commandes.duchesse@gmail.com";

// ---------- Rendu ----------
function renderSimple(cat){
  const container = document.getElementById("list-" + cat);
  container.innerHTML = "";
  DATA[cat].forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="name">${name}</div>
      <input type="number" inputmode="numeric" min="0" placeholder="0" data-cat="${cat}" data-name="${name}">
    `;
    container.appendChild(row);
  });
}

function renderPatisserie(){
  const container = document.getElementById("list-patisserie");
  container.innerHTML = "";
  DATA.patisserie.forEach(name => {
    const det = document.createElement("details");
    det.className = "cake";
    const fmtInputs = FORMATS.map(f => `
      <div class="fmt">
        <label>${FORMAT_LABELS[f]}</label>
        <input type="number" inputmode="numeric" min="0" placeholder="0"
               data-cat="patisserie" data-name="${name}" data-fmt="${f}">
      </div>
    `).join("");
    det.innerHTML = `
      <summary>${name} <span class="chevron">▶</span></summary>
      <div class="formats">${fmtInputs}</div>
    `;
    container.appendChild(det);
  });
}

function renderAll(){
  renderSimple("macarons");
  renderSimple("chocolats");
  renderPatisserie();
}
renderAll();

// ---------- Onglets ----------
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".category").forEach(c=>c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.cat).classList.add("active");
  });
});

// ---------- Ajout de produit (session en cours) ----------
function addSimpleProduct(cat){
  const name = prompt("Nom du nouveau produit :");
  if(name && name.trim()){
    DATA[cat].push(name.trim());
    renderSimple(cat);
  }
}
function addCakeProduct(){
  const name = prompt("Nom du nouveau gâteau :");
  if(name && name.trim()){
    DATA.patisserie.push(name.trim());
    renderPatisserie();
  }
}

// ---------- Date du jour ----------
document.getElementById("today").textContent =
  new Date().toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});

// ---------- Envoi par mail ----------
function sendInventory(){
  const lines = [];

  ["macarons","chocolats"].forEach(cat=>{
    const inputs = document.querySelectorAll(`input[data-cat="${cat}"]`);
    const entries = [];
    inputs.forEach(inp=>{
      const v = parseInt(inp.value,10);
      if(v && v>0){ entries.push(`${inp.dataset.name} : ${v}`); }
    });
    if(entries.length){
      lines.push(cat.charAt(0).toUpperCase()+cat.slice(1));
      lines.push(...entries.map(e=>"- "+e));
      lines.push("");
    }
  });

  // Pâtisserie : regrouper par gâteau
  const cakeInputs = document.querySelectorAll(`input[data-cat="patisserie"]`);
  const cakeMap = {};
  cakeInputs.forEach(inp=>{
    const v = parseInt(inp.value,10);
    if(v && v>0){
      const n = inp.dataset.name;
      if(!cakeMap[n]) cakeMap[n]=[];
      cakeMap[n].push(`${FORMAT_LABELS[inp.dataset.fmt]} : ${v}`);
    }
  });
  const cakeNames = Object.keys(cakeMap);
  if(cakeNames.length){
    lines.push("Patisserie");
    cakeNames.forEach(n=>{
      lines.push(`- ${n} — ${cakeMap[n].join(", ")}`);
    });
    lines.push("");
  }

  if(lines.length===0){
    alert("Aucune quantité saisie pour le moment.");
    return;
  }

  const dateStr = new Date().toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const subject = encodeURIComponent(`Inventaire du ${new Date().toLocaleDateString("fr-FR")}`);

  const header = `Bonjour,\n\nVeuillez trouver ci-dessous l'inventaire réalisé ce ${dateStr}.\n\n${"─".repeat(32)}\n\n`;
  const footer = `\n${"─".repeat(32)}\n\nBonne soirée à toute l'équipe 🥐\nBoulangeries Joseph`;

  const body = encodeURIComponent(header + lines.join("\n") + footer);
  window.location.href = `mailto:${EMAIL_TO}?subject=${subject}&body=${body}`;
}
</script>
</body>
</html>
